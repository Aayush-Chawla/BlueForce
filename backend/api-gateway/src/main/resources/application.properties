# ========== API Gateway App ==========

# Server Port
server.port=9090

# Spring Application Name
spring.application.name=api-gateway


# ========== JWKS endpoints ==========

# URL of JWKS endpoint in AuthService
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8081/.well-known/jwks.json



# ========== Eureka ==========

# Eureka Client Config
# Note: In Docker, this is overridden by JAVA_OPTS to use eureka-server:8761
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Eureka registry refresh configuration
eureka.client.registry-fetch-interval-seconds=10
eureka.client.instance-info-replication-interval-seconds=30

# Force initial registry fetch on startup
eureka.client.should-fetch-registry=true
eureka.client.should-register-with-eureka=true

# Wait for registry to be available before starting
eureka.client.initial-instance-info-replication-interval-seconds=5

# (Optional) prefer showing IP address instead of hostname
eureka.instance.prefer-ip-address=true

# Load balancer configuration for service discovery
spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.max-attempts=3
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=35s


# ========== Gateway Routes ==========

# Gateway timeout configuration
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30000

# Enable debug logging for security and gateway
logging.level.com.blueforce.api_gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG

# Routes configuration - using correct Spring Cloud Gateway format
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

