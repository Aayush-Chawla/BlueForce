version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=blueforce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/ensure_databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  eureka-server:
    build:
      context: ./backend/eureka-server
    image: blueforce-eureka:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - JAVA_OPTS=-Deureka.client.register-with-eureka=false -Deureka.client.fetch-registry=false -Dserver.port=8761

  api-gateway:
    build:
      context: ./backend/api-gateway
    image: blueforce-api-gateway:latest
    container_name: api-gateway
    depends_on:
      eureka-server:
        condition: service_started
    ports:
      - "9090:9090"
    environment:
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Dserver.port=9090

  auth-service:
    build:
      context: ./backend/auth-service
    image: blueforce-auth-service:latest
    container_name: auth-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Dserver.port=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/blueforce_authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=secret

  analytics-service:
    build:
      context: ./backend/analytics-service
    image: blueforce-analytics-service:latest
    container_name: analytics-service
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Dserver.port=8092

  badge-service:
    build:
      context: ./backend/badge-service
    image: blueforce-badge-service:latest
    container_name: badge-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Dserver.port=8088
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/blueforce_badgedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=secret

  certificate-service:
    build:
      context: ./backend/certificate-service
    image: blueforce-certificate-service:latest
    container_name: certificate-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka -Dserver.port=8093
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/blueforce_certificatedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=secret

  chat-service:
